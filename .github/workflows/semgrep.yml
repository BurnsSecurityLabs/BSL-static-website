name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep CI
        run: |
          pip install semgrep
          semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Upload SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@66243766d4ff8a112ae0c868099b2908e2f89f1b # v3.28.10
        with:
          sarif_file: semgrep.sarif
        if: always()
